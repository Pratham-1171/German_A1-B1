<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sprachtreppe — German A1–B1 Master Course v5.4</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--text:#1a1c22;--muted:#6b7280;--line:#e4e7eb;--accent:#1e6feb;--accent2:#0d9488;--warn:#e11d48;--ok:#16a34a;--gold:#d97706;--shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);--header-h:56px;--radius:14px;--tap:44px;--pad-x:clamp(12px,2.5vw,26px);--max-w:1180px;--f-base:clamp(14px,.35vw + 12.8px,15.5px);--f-h2:clamp(18px,1vw + 14.5px,22px);--f-h3:clamp(15px,.5vw + 13.5px,17px)}
html[data-theme="dark"]{--bg:#13161c;--card:#1b1f28;--text:#e9ecf2;--muted:#a2a9b8;--line:#2a303c;--accent:#6fa8ff;--accent2:#4dd4c0;--warn:#f46a87;--ok:#4ade80;--gold:#fbbf24;--shadow:0 1px 3px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.3)}
html[data-fontsize="small"]{--f-base:13px;--f-h2:18px;--f-h3:15px}
html[data-fontsize="large"]{--f-base:17px;--f-h2:24px;--f-h3:19px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:var(--f-base)/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Gujarati",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);min-height:100dvh;display:flex;flex-direction:column}
button,a,input,select,textarea{touch-action:manipulation;font-family:inherit}
header{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);padding:0 var(--pad-x);display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top);height:calc(var(--header-h) + env(safe-area-inset-top));flex:0 0 auto}
.logo{font-weight:800;letter-spacing:-.3px;white-space:nowrap;font-size:clamp(13.5px,.7vw + 11.2px,16px)}
.logo span{color:var(--accent)}
header .spacer{flex:1}
.iconbtn{background:none;border:1px solid var(--line);color:var(--text);width:40px;height:40px;border-radius:10px;cursor:pointer;display:grid;place-items:center;font-size:15px;font-weight:700;transition:.15s;flex:0 0 auto}
.iconbtn:hover{background:var(--bg);border-color:var(--accent)}
.langbtn{min-width:68px;font-size:12px}
nav{position:sticky;top:calc(var(--header-h) + env(safe-area-inset-top));z-index:49;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex:0 0 auto}
nav::-webkit-scrollbar{display:none}
nav .inner{display:inline-flex;padding:0 max(8px,var(--pad-x));gap:2px;min-width:100%}
nav button{background:none;border:none;color:var(--muted);font:inherit;font-size:clamp(12.5px,.25vw + 11.9px,13.5px);font-weight:600;padding:12px;cursor:pointer;border-bottom:2.5px solid transparent;transition:.15s;white-space:nowrap;min-height:var(--tap);display:inline-flex;align-items:center}
nav button.active{color:var(--accent);border-bottom-color:var(--accent)}
html[data-compactnav="1"] nav button{padding:9px 8px;font-size:12px}
main{max-width:var(--max-w);margin:0 auto;width:100%;padding:clamp(14px,2vw,26px) var(--pad-x) 26px;flex:1 0 auto}
h2{font-size:var(--f-h2);letter-spacing:-.3px;margin-bottom:4px;line-height:1.25}
h3{font-size:var(--f-h3);margin:18px 0 8px}
h4{font-size:clamp(14px,.4vw + 12.8px,15.5px);margin:12px 0 6px}
.sub{color:var(--muted);font-size:clamp(12.5px,.2vw + 12px,13.5px);margin-bottom:14px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(12px,1.6vw,16px);margin-bottom:12px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:clamp(8px,1vw,12px)}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(12px,1.4vw,16px);cursor:pointer;transition:.15s;text-align:left;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);min-height:var(--tap);color:var(--text);font:inherit}
.tile:hover{border-color:var(--accent)}
.tile .t-ico{font-size:clamp(18px,1vw + 14px,22px)}
.tile .t-name{font-weight:700;font-size:clamp(13.5px,.4vw + 12.5px,14.5px)}
.tile .t-desc{color:var(--muted);font-size:11.5px;line-height:1.35}
input[type=text],input[type=search],select,textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:14px;outline:none;min-height:var(--tap);-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,111,235,.12)}
textarea{min-height:120px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto !important;min-width:0}
.btn{background:var(--accent);color:#fff;border:none;padding:12px 18px;border-radius:10px;font:inherit;font-weight:650;font-size:14px;cursor:pointer;transition:.15s;min-height:var(--tap);display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.small{padding:8px 12px;font-size:12.5px;border-radius:8px;min-height:36px}
.btn.tiny{padding:6px 10px;font-size:11.5px;min-height:30px;border-radius:7px}
.btn.good{background:var(--ok)}
.btn.bad{background:var(--warn)}
.chipgroup{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);flex-wrap:wrap}
.chipgroup button{padding:9px 14px;border:none;background:none;color:var(--text);font:inherit;font-size:13px;cursor:pointer;border-right:1px solid var(--line);min-height:38px;font-weight:600;transition:.15s}
.chipgroup button:last-child{border-right:none}
.chipgroup button.active{background:var(--accent);color:#fff}
.vlist{display:flex;flex-direction:column;gap:6px}
.vrow{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:11px}
.vrow .vnum{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.vrow .vde{font-weight:650;font-size:14.5px;word-break:break-word}
.vrow .ven{color:var(--muted);font-size:12.5px;text-align:right;display:flex;align-items:center;gap:4px;justify-content:flex-end}
.art{display:inline-block;font-size:11px;font-weight:800;padding:1px 6px;border-radius:5px;margin-right:6px;vertical-align:1px;letter-spacing:.3px}
.art.der{background:#dbeafe;color:#1d4ed8}
.art.die{background:#fee2e2;color:#b91c1c}
.art.das{background:#dcfce7;color:#15803d}
html[data-theme="dark"] .art.der{background:#1e3a8a;color:#c7d9ff}
html[data-theme="dark"] .art.die{background:#7f1d1d;color:#ffd1d1}
html[data-theme="dark"] .art.das{background:#14532d;color:#c9f7d3}
.bookmark{background:none;border:none;cursor:pointer;font-size:17px;opacity:.4;padding:6px;min-width:32px;min-height:32px;display:grid;place-items:center;border-radius:8px;color:var(--text)}
.bookmark.on{opacity:1;color:var(--gold)}
.speak-btn{background:none;border:none;cursor:pointer;font-size:15px;opacity:.65;padding:6px;min-width:32px;min-height:32px;display:grid;place-items:center;border-radius:8px;color:var(--accent)}
.speak-btn:active{transform:scale(.9)}
.flash-wrap{perspective:1200px;max-width:560px;margin:10px auto}
.flash{position:relative;width:100%;min-height:clamp(200px,42vh,260px);transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.flash.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(18px,3vw,28px);text-align:center;box-shadow:var(--shadow);overflow:hidden}
.face.back{transform:rotateY(180deg);background:linear-gradient(135deg,var(--card),var(--bg))}
.face .big{font-size:clamp(20px,2vw + 14px,28px);font-weight:750;margin-bottom:8px;word-break:break-word}
.face .big-en{font-size:clamp(15px,1vw + 12px,19px);font-weight:600;color:var(--accent2);margin-bottom:8px}
.face .small{color:var(--muted);font-size:12.5px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:11px;font:inherit;font-size:14px;color:var(--text);cursor:pointer;transition:.15s;min-height:var(--tap);word-break:break-word}
.opt:hover{border-color:var(--accent)}
.opt.correct{border-color:var(--ok);background:rgba(22,163,74,.09);font-weight:650}
.opt.wrong{border-color:var(--warn);background:rgba(225,29,72,.09)}
.opt:disabled{cursor:default}
.qstat{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .4s}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat .n{font-size:clamp(20px,1.5vw + 16px,24px);font-weight:800;color:var(--accent);line-height:1.1}
.stat .l{font-size:11.5px;color:var(--muted);margin-top:4px}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
.tag.A1{background:#dbeafe;color:#1d4ed8}
.tag.A2{background:#fef3c7;color:#b45309}
.tag.B1{background:#fce7f3;color:#be185d}
html[data-theme="dark"] .tag.A1{background:#1e3a8a;color:#c7d9ff}
html[data-theme="dark"] .tag.A2{background:#78350f;color:#fde68a}
html[data-theme="dark"] .tag.B1{background:#831843;color:#fbcfe8}
.passage{line-height:1.75;font-size:14.5px}
.passage p{margin-bottom:12px}
.qa{margin-top:14px}
.qa .q{font-weight:650;margin-bottom:8px;font-size:14px;line-height:1.5}
.hidden{display:none !important}
.center{text-align:center}
.mt{margin-top:14px}
.pill{display:inline-block;font-size:11.5px;padding:4px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted);margin:0 4px 4px 0}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:14px}
.mini-muted{color:var(--muted);font-size:13px;line-height:1.5}
footer{flex:0 0 auto;width:100%;margin-top:24px;padding:18px max(16px,var(--pad-x)) calc(24px + env(safe-area-inset-bottom));text-align:center;color:var(--muted);font-size:12px;line-height:1.5;border-top:1px solid var(--line);background:var(--card)}
footer .foot-brand{font-weight:700;color:var(--text)}
footer .foot-sub{font-size:11.5px;margin-top:2px}
footer .foot-ver{font-size:10.5px;opacity:.7;margin-top:4px}
.res-card{display:flex;gap:14px;align-items:flex-start}
.res-card .res-icon{font-size:24px;flex-shrink:0;width:42px;text-align:center}
.res-card .res-body{flex:1;min-width:0}
.res-card h4{margin-bottom:3px}
.res-card .res-url{font-size:12px;color:var(--accent);word-break:break-all;margin-bottom:6px}
.res-card .res-url a{color:var(--accent);text-decoration:none}
.res-card .res-desc{font-size:13px;color:var(--muted);line-height:1.55}
.today-dash{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:18px;border-radius:16px;margin-bottom:14px}
.today-dash h3{color:#fff;margin:0 0 4px;font-size:18px}
.today-dash .td-sub{color:rgba(255,255,255,.85);font-size:12.5px;margin-bottom:10px}
.streak-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);padding:5px 12px;border-radius:99px;font-size:12.5px;font-weight:700;margin-bottom:10px}
.goal-bar{height:12px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden;margin-top:8px}
.goal-bar>i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .4s}
.today-dash .td-stats{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:10px}
.today-dash .td-stats span{background:rgba(255,255,255,.2);padding:3px 10px;border-radius:99px}
.srs-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.srs-btn{padding:12px 4px;border:none;border-radius:11px;font:inherit;font-weight:700;cursor:pointer;font-size:12px;color:#fff;display:flex;flex-direction:column;gap:3px;align-items:center}
.srs-btn .srs-emoji{font-size:18px}
.srs-btn.again{background:#ef4444}
.srs-btn.hard{background:#f97316}
.srs-btn.good{background:#22c55e}
.srs-btn.easy{background:#0ea5e9}
.mistake-card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;background:var(--card)}
.mistake-card .mc-prompt{font-size:14px;line-height:1.5;margin-bottom:6px}
.mistake-card .mc-user{color:var(--warn);font-weight:600;font-size:13.5px}
.mistake-card .mc-correct{color:var(--ok);font-weight:600;font-size:13.5px}
.mistake-card .mc-meta{font-size:11.5px;color:var(--muted);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mastery-chip{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;letter-spacing:.4px;text-transform:uppercase}
.mastery-NEW{background:#e5e7eb;color:#4b5563}
.mastery-LEARNING{background:#fef3c7;color:#b45309}
.mastery-FAMILIAR{background:#dbeafe;color:#1d4ed8}
.mastery-STRONG{background:#dcfce7;color:#15803d}
.mastery-MASTERED{background:#a855f7;color:#fff}
html[data-theme="dark"] .mastery-NEW{background:#374151;color:#d1d5db}
html[data-theme="dark"] .mastery-LEARNING{background:#78350f;color:#fde68a}
.session-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.session-card .sc-type{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.5px;text-transform:uppercase}
.session-progress{display:flex;gap:4px;margin-bottom:10px}
.session-progress .sp-dot{flex:1;height:5px;background:var(--line);border-radius:99px}
.session-progress .sp-dot.done{background:var(--ok)}
.session-progress .sp-dot.current{background:var(--accent)}
.family-tree{font-family:ui-monospace,Menlo,monospace;font-size:13.5px;background:var(--bg);padding:14px;border-radius:10px;line-height:1.8;overflow-x:auto;white-space:pre-wrap}
.builder-tiles{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;min-height:40px}
.builder-tile{padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;cursor:pointer;min-height:38px;color:var(--text)}
.builder-tile:hover{border-color:var(--accent)}
.builder-tile.used{opacity:.3;pointer-events:none}
.builder-answer{min-height:56px;padding:12px;background:var(--bg);border:2px dashed var(--line);border-radius:11px;font-size:15px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;line-height:1.4}
.builder-answer .word{padding:6px 11px;background:var(--card);border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:14px}
.spell-input{width:100%;padding:16px;font-size:20px;text-align:center;border-radius:12px;border:2px solid var(--line);font-family:inherit;background:var(--card);color:var(--text);outline:none}
.spell-input:focus{border-color:var(--accent)}
.spell-input.correct{border-color:var(--ok);background:rgba(22,163,74,.08)}
.spell-input.wrong{border-color:var(--warn);background:rgba(225,29,72,.08)}
.achievement{display:flex;gap:12px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:11px;margin-bottom:6px;align-items:center}
.achievement.locked{opacity:.45;filter:grayscale(1)}
.achievement .ach-icon{font-size:22px;flex-shrink:0;width:34px;text-align:center}
.achievement .ach-name{font-weight:650;font-size:13.5px}
.achievement .ach-desc{font-size:11.5px;color:var(--muted);margin-top:2px}
.exam-box{background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:14px;margin-bottom:12px}
.exam-timer{font-family:ui-monospace,Menlo,monospace;font-size:20px;font-weight:800;color:var(--warn);letter-spacing:1px}
.collo-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.collo-card .cc-phrase{font-weight:700;font-size:15px;color:var(--accent);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.collo-card .cc-en{color:var(--muted);font-size:12.5px;margin-top:3px}
.collo-card .cc-ex{background:var(--bg);border-left:3px solid var(--accent2);padding:8px 11px;border-radius:6px;font-size:13.5px;line-height:1.55;margin-top:8px}
.cmp-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.cmp-card .cmp-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.cmp-card .cmp-word{font-weight:800;font-size:16px;color:var(--accent)}
.cmp-card .cmp-vs{color:var(--muted);font-weight:700;font-size:12px}
.cmp-card .cmp-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.cmp-card .cmp-side{background:var(--bg);border-radius:9px;padding:10px 12px;font-size:13px;line-height:1.5}
.cmp-card .cmp-side b{color:var(--accent2);display:block;margin-bottom:4px}
.cmp-card .cmp-note{margin-top:10px;font-size:12.5px;color:var(--muted);background:var(--bg);padding:8px 11px;border-radius:8px;border-left:3px solid var(--gold)}
.conn-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.conn-card .cn-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:5px}
.conn-card .cn-word{font-weight:750;font-size:15.5px;color:var(--accent);display:flex;align-items:center;gap:8px}
.conn-card .cn-func{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--bg);color:var(--muted)}
.conn-card .cn-meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.conn-card .cn-ex{background:var(--bg);border-radius:7px;padding:8px 11px;font-size:13.5px;line-height:1.55;margin-top:6px}
.settings-section{margin-bottom:18px}
.settings-section h4{margin:0 0 10px;font-size:13.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.setting-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.setting-row .sr-label{font-size:13.5px;font-weight:600}
.setting-row select,.setting-row input[type=text]{min-width:140px;padding:8px 10px;min-height:36px;font-size:13px}
.setting-row .switch{position:relative;display:inline-block;width:46px;height:26px;flex-shrink:0}
.setting-row .switch input{opacity:0;width:0;height:0}
.setting-row .switch span{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--line);transition:.2s;border-radius:99px}
.setting-row .switch span:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background:#fff;transition:.2s;border-radius:50%}
.setting-row .switch input:checked + span{background:var(--accent)}
.setting-row .switch input:checked + span:before{transform:translateX(20px)}
.setup-panel{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:14px}
.setup-panel .sp-row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;margin-bottom:10px}
.setup-panel .sp-row:last-child{margin-bottom:0}

let _voice = null;
function getGermanVoice(){
  if(_voice) return _voice;
  if(!('speechSynthesis' in window)) return null;
  const voices = speechSynthesis.getVoices();
  _voice = voices.find(v => v.lang === 'de-DE') || voices.find(v => v.lang && v.lang.startsWith('de')) || null;
  return _voice;
}
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => { _voice = null; getGermanVoice(); };
function speakGerman(text, rate){
  if(!S.settings.audioEnabled) return;
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const clean = String(text).replace(/\s+/g, ' ').trim();
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'de-DE'; u.rate = rate || S.settings.speechRate || 0.9; u.pitch = 1;
  const v = getGermanVoice(); if(v) u.voice = v;
  speechSynthesis.speak(u);
  trackAudioPlay();
}

    b.addEventListener('click', e => {

function getMastery(key){
  return S.mastery[key] || {seen:0, correct:0, wrong:0, streak:0, ease:2.5, interval:0, lastSeen:0, nextReview:0, status:'NEW'};
}
function updateMastery(key, quality){
  let q = quality;
  if(q === true) q = 2;
  if(q === false) q = 0;
  const m = getMastery(key);
  m.seen++;
  if(q >= 1){ m.correct++; m.streak++; } else { m.wrong++; m.streak = 0; }
  if(q === 0){ m.interval = 10/(60*24); m.ease = Math.max(1.3, m.ease - 0.2); }
  else if(q === 1){ m.interval = m.interval ? Math.max(1, m.interval * 1.2) : 1; m.ease = Math.max(1.3, m.ease - 0.15); }
  else if(q === 2){ m.interval = m.interval ? Math.max(1, m.interval * m.ease) : 1; }
  else { m.interval = m.interval ? Math.max(3, m.interval * m.ease * 1.3) : 3; m.ease = Math.min(3.0, m.ease + 0.15); }
  m.interval = Math.min(m.interval, 365);
  m.lastSeen = Date.now();
  m.nextReview = Date.now() + m.interval * 24*60*60*1000;
  if(m.correct >= 8 && m.streak >= 4) m.status = 'MASTERED';
  else if(m.correct >= 4 && m.streak >= 2) m.status = 'STRONG';
  else if(m.correct >= 2) m.status = 'FAMILIAR';
  else if(m.seen > 0) m.status = 'LEARNING';
  S.mastery[key] = m;
  if(m.status === 'MASTERED' || m.status === 'STRONG') S.known[key] = 1;
  STORE.save(); checkAchievements();
  return m;
}

const __recentFingerprints = [];
const MAX_FINGERPRINTS = 200;
function exerciseFingerprint(text){
  return String(text).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^\p{L}\p{N}\s]/gu,"").replace(/\s+/g," ").trim();
}
function isDuplicate(fp){ return __recentFingerprints.includes(fp); }
function rememberFingerprint(fp){
  __recentFingerprints.push(fp);
  if(__recentFingerprints.length > MAX_FINGERPRINTS) __recentFingerprints.shift();
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* ============================================================
   VOCAB EXERCISE GENERATOR
   ============================================================ */
function distractorCount(difficulty){ return difficulty <= 1 ? 2 : 3; }
function betterDistractors(w, count, mode){
  // Prefer same level, same topic, same article (for nouns), similar length; avoid identical meanings
  const sameLevel = VOCAB.filter(x => x !== w && x.level === w.level);
  const sameTopic = sameLevel.filter(x => x.topic === w.topic);
  const sameArt = VOCAB.filter(x => x !== w && x.art && x.art === w.art && x.art !== '-');
  let pool = [];
  if(mode === 'meaning'){
    const correct = meaningFull(w);
    const prefer = (sameTopic.length >= count ? sameTopic : sameLevel.length >= count ? sameLevel : VOCAB)
      .filter(x => meaningFull(x) !== correct);
    pool = prefer;
  } else if(mode === 'de'){
    const prefer = (sameTopic.length >= count ? sameTopic : sameLevel.length >= count ? sameLevel : VOCAB)
      .filter(x => x.de !== w.de);
    // Prefer similar length words for harder confusion
    prefer.sort((a,b) => Math.abs(a.de.length - w.de.length) - Math.abs(b.de.length - w.de.length));
    pool = prefer;
  } else {
    pool = VOCAB.filter(x => x !== w);
  }
  return shuffle(pool).slice(0, count);
}
function generateVocabExercise(type, pool, difficulty, level){
  difficulty = difficulty || 2;
  const basePool = pool && pool.length ? pool : VOCAB.filter(w => !level || w.level === level);
  const usePool = basePool.length ? basePool : VOCAB;
  let attempts = 0;
  while(attempts < 20){
    const w = usePool[Math.floor(Math.random() * usePool.length)];
    const speakText = (w.art && w.art !== '-' ? w.art + ' ' : '') + w.de;
    const type_ = type || pick(['de-en','en-de','article','listen']);
    let ex;
    if(type_ === 'de-en'){
      const correct = meaningFull(w);
      const wrongPool = betterDistractors(w, distractorCount(difficulty), 'meaning');
      const options = shuffle([correct, ...wrongPool.map(x => meaningFull(x))]);
      // Deduplicate options just in case
      const unique = [...new Set(options)];
      while(unique.length < distractorCount(difficulty)+1){
        const extra = meaningFull(VOCAB[Math.floor(Math.random()*VOCAB.length)]);
        if(!unique.includes(extra)) unique.push(extra);
      }
      ex = {skill:'vocabulary', prompt:`What does "${speakText}" mean?`, promptHTML:`What does <b>${esc(speakText)}</b> mean? ${speakerBtn(speakText)}`,
        options: unique.slice(0, distractorCount(difficulty)+1), correct, explanation:`${speakText} = ${meaningFull(w)}`, sourceId:'v'+w.n, difficulty, vocab:w};
    } else if(type_ === 'en-de'){
      const correct = w.de;
      const wrongPool = betterDistractors(w, distractorCount(difficulty), 'de');
      const options = shuffle([correct, ...wrongPool.map(x => x.de)]);
      const unique = [...new Set(options)];
      while(unique.length < distractorCount(difficulty)+1){
        const extra = VOCAB[Math.floor(Math.random()*VOCAB.length)].de;
        if(!unique.includes(extra)) unique.push(extra);
      }
      ex = {skill:'vocabulary', prompt:`How do you say "${w.en}" in German?`, promptHTML:`How do you say <b>${esc(meaningFull(w))}</b> in German?`,
        options: unique.slice(0, distractorCount(difficulty)+1), correct, explanation:`"${w.en}" = ${speakText}`, sourceId:'v'+w.n, difficulty, vocab:w};
    } else if(type_ === 'article'){
      if(!w.art || w.art === '-'){ attempts++; continue; }
      ex = {skill:'articles', prompt:`Which article goes with "${w.de}"?`, promptHTML:`Which article goes with <b>${esc(w.de)}</b>? ${speakerBtn(w.de)}`,
        options:['der','die','das'], correct:w.art, explanation:`${w.art} ${w.de} = ${meaningFull(w)}`, sourceId:'v'+w.n, difficulty, vocab:w};
    } else if(type_ === 'listen'){
      const correct = w.de;
      const wrongPool = betterDistractors(w, distractorCount(difficulty), 'de');
      const options = shuffle([correct, ...wrongPool.map(x => x.de)]);
      const unique = [...new Set(options)];
      while(unique.length < distractorCount(difficulty)+1){
        const extra = VOCAB[Math.floor(Math.random()*VOCAB.length)].de;
        if(!unique.includes(extra)) unique.push(extra);
      }
      ex = {skill:'listening', prompt:'Listen and choose the correct German word.', promptHTML:`Listen and choose: <br><button class="btn small" onclick="speakGerman('${esc(w.de).replace(/'/g,"\'")}')">🔊 Play</button>`,
        options: unique.slice(0, distractorCount(difficulty)+1), correct, explanation:`The word was: ${speakText}`, sourceId:'v'+w.n, difficulty, vocab:w, autoPlay: w.de};
    } else if(type_ === 'opposite'){
      // Sample from OPPOSITES directly for reliability
      const pair = OPPOSITES[Math.floor(Math.random() * OPPOSITES.length)];
      const askFirst = Math.random() < 0.5;
      const promptWord = askFirst ? pair[0] : pair[2];
      const promptEn = askFirst ? pair[1] : pair[3];
      const correct = askFirst ? pair[2] : pair[0];
      const correctEn = askFirst ? pair[3] : pair[1];
      const wrongs = shuffle(OPPOSITES.filter(p => p[0] !== correct && p[2] !== correct && p[0] !== promptWord && p[2] !== promptWord)
        .map(p => Math.random()<0.5 ? p[0] : p[2])).slice(0, distractorCount(difficulty));
      const unique = [...new Set([correct, ...wrongs])];
      while(unique.length < distractorCount(difficulty)+1){
        const extra = OPPOSITES[Math.floor(Math.random()*OPPOSITES.length)];
        const cand = Math.random()<0.5 ? extra[0] : extra[2];
        if(!unique.includes(cand) && cand !== promptWord) unique.push(cand);
      }
      ex = {skill:'opposites', prompt:`What is the opposite of "${promptWord}"?`, promptHTML:`What is the opposite of <b>${esc(promptWord)}</b> (${esc(promptEn)})? ${speakerBtn(promptWord)}`,
        options: shuffle(unique.slice(0, distractorCount(difficulty)+1)), correct, explanation:`${promptWord} ↔ ${correct} (${correctEn})`, sourceId:'opp-'+promptWord, difficulty};
    } else if(type_ === 'synonym'){
      const entry = SYNONYMS[Math.floor(Math.random() * SYNONYMS.length)];
      // Ask for a synonym of the headword, or sometimes of one of the synonyms
      const useHead = Math.random() < 0.7 || entry.syn.length === 0;
      const promptWord = useHead ? entry.word : entry.syn[Math.floor(Math.random()*entry.syn.length)][0];
      const correct = useHead ? entry.syn[0][0] : entry.word;
      const allRelated = new Set([entry.word, ...entry.syn.map(x => x[0])]);
      const wrongs = shuffle(SYNONYMS.filter(s => s.word !== entry.word)
        .flatMap(s => [s.word, ...s.syn.map(x => x[0])]))
        .filter(x => !allRelated.has(x)).slice(0, distractorCount(difficulty));
      const unique = [...new Set([correct, ...wrongs])];
      while(unique.length < distractorCount(difficulty)+1){
        const extra = SYNONYMS[Math.floor(Math.random()*SYNONYMS.length)].word;
        if(!unique.includes(extra) && !allRelated.has(extra)) unique.push(extra);
      }
      ex = {skill:'synonyms', prompt:`Which word is a synonym of "${promptWord}"?`, promptHTML:`Which word is a synonym of <b>${esc(promptWord)}</b>? ${speakerBtn(promptWord)}`,
        options: shuffle(unique.slice(0, distractorCount(difficulty)+1)), correct, explanation:`${promptWord} ≈ ${correct}`, sourceId:'syn-'+promptWord, difficulty};
    }
    if(!ex){ attempts++; continue; }
    const fp = exerciseFingerprint(ex.prompt + '|' + ex.correct);
    if(!isDuplicate(fp)){ rememberFingerprint(fp); return ex; }
    attempts++;
  }
  // Safe fallback without dummy options
  const w = usePool[Math.floor(Math.random()*usePool.length)] || VOCAB[0];
  const speakText = (w.art && w.art !== '-' ? w.art + ' ' : '') + w.de;
  const wrongs = shuffle(VOCAB.filter(x => x.de !== w.de)).slice(0,2).map(x => meaningFull(x));
  return {skill:'vocabulary', prompt:`What does "${speakText}" mean?`, promptHTML:`What does <b>${esc(speakText)}</b> mean?`,
    options: shuffle([meaningFull(w), ...wrongs]), correct: meaningFull(w), explanation:`${speakText} = ${meaningFull(w)}`, sourceId:'v'+w.n, vocab:w};
}

let __rng = Math.random;
function seededRandom(seed){
  let x = (seed | 0) || 0x9E3779B9;

}
function setSeed(s){ __rng = seededRandom(s); }
function rnd(){ return __rng(); }
function rPick(a){ return a[Math.floor(rnd() * a.length)]; }
function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

function generateScenario(level, topic){
  const isF = rnd() < 0.5;
  const name = rPick(isF ? POOL.namesF : POOL.namesM);
  const pronoun = isF ? 'sie' : 'er';
  const city = rPick(POOL.cities);
  let dest = rPick(POOL.cities); let g = 0;
  while(dest === city && g++ < 5) dest = rPick(POOL.cities);
  return {name, pronoun, isF, city, dest, time: rPick(POOL.times), transport: rPick(POOL.transport),
    activity: rPick(POOL.activities), problem: rPick(POOL.problems), feeling: rPick(POOL.feelings),
    level: level || 'A2', topic: topic || 'daily-life'};
}

function generateReadingTask(level, topic){

    sn.push(`${cap(s.pronoun)} ${conj('aufstehen', s.pronoun)} um sieben Uhr auf.`);
    sn.push(`Danach frühstückt ${s.pronoun}.`);
    sn.push(`${cap(s.time)} ${conj('fahren', s.pronoun)} ${s.pronoun} ${s.transport} nach ${s.dest}.`);
    sn.push(`${cap(s.pronoun)} möchte ${s.activity}.`);
    sn.push(`Am Ende ist ${s.pronoun} ${s.feeling}.`);
  } else if(level === 'A2'){
    sn.push(`${s.name} wohnt in ${s.city} und arbeitet dort.`);
    sn.push(`Letztes Wochenende ist ${s.pronoun} ${s.transport} nach ${s.dest} gefahren.`);
    sn.push(`${cap(s.pronoun)} wollte ${s.activity}.`);
    sn.push(`Leider gab es ein Problem: ${s.problem}.`);
    sn.push(`Trotzdem war ${s.pronoun} am Ende ${s.feeling}.`);
    sn.push(`${cap(s.pronoun)} möchte nächste Woche wieder dorthin fahren.`);
  } else {
    sn.push(`${s.name} lebt seit einigen Jahren in ${s.city}.`);
    sn.push(`Obwohl ${s.pronoun} gerne reist, hat ${s.pronoun} nur selten Zeit dafür.`);
    sn.push(`Letztes Wochenende ist ${s.pronoun} jedoch ${s.transport} nach ${s.dest} gefahren.`);
    sn.push(`Während der Fahrt gab es ein Problem: ${s.problem}.`);
    sn.push(`Trotzdem konnte ${s.pronoun} am Ende ${s.activity}.`);
    sn.push(`Wenn ${s.pronoun} mehr Zeit hätte, würde ${s.pronoun} öfter solche Reisen machen.`);
    sn.push(`Nach der Reise war ${s.pronoun} zwar erschöpft, aber auch sehr ${s.feeling}.`);
  }
  const text = sn.join(' ');
  const qs = [
    [`Wo wohnt ${s.name}?`, `In ${s.city}.`],
    [`Wohin ist ${s.name} gefahren?`, `Nach ${s.dest}.`],
    [`Wie ist ${s.name} gefahren?`, `${cap(s.transport)}.`],
    [`Was wollte ${s.name} machen?`, `${cap(s.activity)}.`],
    [`Wie war ${s.name} am Ende?`, `${s.pronoun} war ${s.feeling}.`]
  ];
  S.readingsGenerated = (S.readingsGenerated||0) + 1; STORE.save(); checkAchievements();
  return {level, topic: s.topic, title:`${s.name} reist nach ${s.dest}`, text, qs, scenario: s};
}

function generateDialogueTask(level, topic){
  level = level || rPick(['A1','A2','B1']);
  const s = generateScenario(level, topic);
  const friend = rPick(s.isF ? POOL.namesM : POOL.namesF);
  const greeting = rPick(POOL.greetings);
  const lines = [];
  if(level === 'A1'){
    lines.push({sp:s.name, de:`${greeting}, ${friend}!`, en:`${greeting}, ${friend}!`});
    lines.push({sp:friend, de:`Hallo ${s.name}! Wie geht es dir?`, en:`Hello ${s.name}! How are you?`});
    lines.push({sp:s.name, de:`Mir geht es gut, danke. Ich fahre ${s.time} nach ${s.dest}.`, en:`I am well, thanks. I am going to ${s.dest} ${s.time}.`});
    lines.push({sp:friend, de:`Schön! ${cap(s.transport)}?`, en:`Nice! ${cap(s.transport)}?`});
    lines.push({sp:s.name, de:`Ja, genau. Ich möchte ${s.activity}.`, en:`Yes, exactly. I want to ${s.activity}.`});
    lines.push({sp:friend, de:`Viel Spaß!`, en:`Have fun!`});
  } else if(level === 'A2'){
    lines.push({sp:s.name, de:`${greeting}! Wie war dein Wochenende?`, en:`${greeting}! How was your weekend?`});
    lines.push({sp:friend, de:`Ganz gut, danke. Ich bin ${s.transport} nach ${s.dest} gefahren.`, en:`Pretty good, thanks. I went to ${s.dest} ${s.transport}.`});
    lines.push({sp:s.name, de:`Wirklich? Was hast du dort gemacht?`, en:`Really? What did you do there?`});
    lines.push({sp:friend, de:`Ich habe ${s.activity} können.`, en:`I was able to ${s.activity}.`});
    lines.push({sp:s.name, de:`Und gab es Probleme?`, en:`And were there any problems?`});
    lines.push({sp:friend, de:`Leider ja: ${s.problem}.`, en:`Unfortunately yes: ${s.problem}.`});
    lines.push({sp:s.name, de:`Oh nein! Aber sonst war alles gut?`, en:`Oh no! But otherwise everything was good?`});
    lines.push({sp:friend, de:`Ja, am Ende war ich trotzdem ${s.feeling}.`, en:`Yes, in the end I was still ${s.feeling}.`});
  } else {
    lines.push({sp:'Moderator', de:`Willkommen zur Sendung. Heute sprechen wir über Reisen.`, en:`Welcome. Today we talk about travel.`});
    lines.push({sp:s.name, de:`Ich reise sehr gerne, obwohl ich nur selten Zeit habe.`, en:`I love to travel, although I rarely have time.`});
    lines.push({sp:'Moderator', de:`Erzählen Sie uns von Ihrer letzten Reise.`, en:`Tell us about your last trip.`});
    lines.push({sp:s.name, de:`Letztes Wochenende bin ich ${s.transport} nach ${s.dest} gefahren.`, en:`Last weekend I went to ${s.dest} ${s.transport}.`});
    lines.push({sp:s.name, de:`Während der Fahrt gab es ein Problem: ${s.problem}.`, en:`During the trip there was a problem: ${s.problem}.`});
    lines.push({sp:'Moderator', de:`Wie sind Sie damit umgegangen?`, en:`How did you deal with it?`});
    lines.push({sp:s.name, de:`Trotzdem konnte ich ${s.activity}. Danach war ich sehr ${s.feeling}.`, en:`Nevertheless I could ${s.activity}. Afterwards I was very ${s.feeling}.`});
    lines.push({sp:'Moderator', de:`Vielen Dank für das Gespräch!`, en:`Thank you very much!`});
  }
  const q1C = s.dest, q1W = shuffle(POOL.cities.filter(c => c !== q1C)).slice(0,2);
  const q2C = s.transport, q2W = shuffle(POOL.transport.filter(x => x !== q2C)).slice(0,2);
  const q3C = s.feeling, q3W = shuffle(POOL.feelings.filter(x => x !== q3C)).slice(0,2);
  const questions = [
    {q:`Wohin ist ${s.name} gefahren?`, options: shuffle([q1C, ...q1W]), correct: q1C},
    {q:`Wie ist ${s.name} gefahren?`, options: shuffle([q2C, ...q2W]), correct: q2C},
    {q:`Wie war ${s.name} am Ende?`, options: shuffle([q3C, ...q3W]), correct: q3C}
  ];
  return {level, title:`Dialog: ${s.name} reist nach ${s.dest}`, setting:`A ${level} dialogue about travel.`, lines, questions, scenario: s};
}

function generateVerbUsageExercise(){
  const keys = Object.keys(VERB_USAGE || {});
  if(!keys.length) return generateVocabExercise('de-en');
  const k = rPick(keys);
  const u = VERB_USAGE[k];
  const pattern = rPick(u.patterns);
  const words = pattern.split(/\s+/);
  const candidates = words.map((w,i) => ({w, i})).filter(x => x.w.length > 2 && /^[a-zäöüß]/i.test(x.w));
  if(!candidates.length) return generateVocabExercise('de-en');
  const blank = rPick(candidates);
  const prompt = words.map((w,i) => i === blank.i ? '___' : w).join(' ');
  const correct = blank.w;
  const wrongPool = [];
  keys.forEach(kk => VERB_USAGE[kk].patterns.forEach(p => p.split(/\s+/).forEach(w => {
    if(w !== correct && w.length > 3 && !wrongPool.includes(w)) wrongPool.push(w);
  })));
  while(wrongPool.length < 3) wrongPool.push('gehen');
  return {
    skill:'verb-usage', topic:'verb usage', level:'A2',
    promptHTML:`Which word completes: <b>${esc(prompt)}</b>?<br><em class="mini-muted">Verb: ${esc(k)} (${esc(u.meaning)})</em>`,
    prompt:`Complete: ${prompt} (verb: ${k})`,
    options: shuffle([correct, ...shuffle(wrongPool).slice(0,3)]),
    correct, explanation:`${pattern} — from verb ${k}`, sourceId:'verb-'+k
  };
}

function generateGrammarExerciseLadder(level, difficulty){
  const sections = level && level !== 'all' ? GRAMMAR_DATA.filter(s => s.level === level) : GRAMMAR_DATA;
  const section = rPick(sections);
  const item = rPick(section.items);
  const diff = difficulty || 'normal';

  if(diff === 'expert' && item.mistakes && item.mistakes.length){
    const pair = rPick(item.mistakes);
    const bad = pair[0].replace(/^❌\s*/, '');
    const correct = pair[1].replace(/^✅\s*/, '');
    const distractors = item.mistakes.filter(p => p !== pair).map(p => p[0].replace(/^❌\s*/, ''));
    while(distractors.length < 3) distractors.push(correct.replace(/[a-zäöü]/g, m => m.toUpperCase()));
    return {
      skill:'grammar', topic:item.title, level:section.level,
      promptHTML:`Correct this sentence:<br><b>${esc(bad)}</b>`,
      prompt:`Correct: ${bad}`,
      options: shuffle([correct, ...shuffle(distractors).slice(0,3)]),
      correct, explanation: item.explanation, sourceId:'gx-'+section.level+'-'+item.title
    };
  }

  if(item.examples && item.examples.length){
    const ex = rPick(item.examples);
    const de = ex[0], en = ex[1];
    const words = de.split(/\s+/);
    const candidates = [];
    words.forEach((w, i) => {
      const c = w.replace(/[.,!?;:]/g, '');
      if(i > 0 && c.length > 3 && !/^\d+$/.test(c)) candidates.push(i);
    });
    if(candidates.length){
      const blankIdx = rPick(candidates);
      const correct = words[blankIdx].replace(/[.,!?;:]/g, '');
      const prompt = words.map((w, i) => i === blankIdx ? '___' : w).join(' ');
      const wrongs = [];
      item.examples.forEach(e => e[0].split(/\s+/).forEach(w => {
        const c = w.replace(/[.,!?;:]/g, '');
        if(c !== correct && c.length > 2 && !wrongs.includes(c)) wrongs.push(c);
      }));
      if(wrongs.length < 3){
        section.items.forEach(it => (it.examples || []).forEach(e => e[0].split(/\s+/).forEach(w => {
          const c = w.replace(/[.,!?;:]/g, '');
          if(c !== correct && c.length > 2 && !wrongs.includes(c)) wrongs.push(c);
        })));
      }
      while(wrongs.length < 3) wrongs.push('gehen');
      return {
        skill:'grammar', topic:item.title, level:section.level,
        promptHTML:`${esc(prompt)}<br><em class="mini-muted">${esc(en)}</em>`,
        prompt,
        options: shuffle([correct, ...shuffle(wrongs).slice(0,3)]),
        correct, explanation:`${correct} → "${de}"`, sourceId:'g-'+section.level+'-'+item.title
      };
    }
  }
  const ex = item.exercise;
  const correct = ex.options[ex.correct];
  return {
    skill:'grammar', topic:item.title, level:section.level,
    promptHTML:esc(ex.q), prompt:ex.q,
    options: shuffle([...ex.options]), correct,
    explanation: ex.why, sourceId:'g-'+section.level+'-'+item.title
  };
}

function generateConnectorExercise(c){
  const options = ['main clause — verb position 2', 'subordinate clause — verb at end', 'adverb — verb next'];
  const correct = c.clause === 'main' ? (c.order === 'position-2-verb-next' || c.order === 'verb-position-2' ? 2 : 0) : 1;
  return {
    prompt: `"${c.word}" (${c.meaning}) — how is it used?`,
    promptHTML: `<b>${esc(c.word)}</b> (${esc(c.meaning)}) — clause type?`,
    options, correct: options[correct],
    explanation: `${c.word} — ${c.clause}, ${c.order}`,
    connector: c
  };
}
function generateCollocationExercise(c){
  const allVerbs = shuffle(COLLOCATIONS.map(x => x.verb).filter(v => v !== c.verb)).slice(0, 3);
  const options = shuffle([c.verb, ...allVerbs]);
  const prompt = c.phrase.replace(new RegExp('\\b' + c.verb + '\\b'), '___');
  return {
    prompt: `Which verb completes: "${prompt}"?`,
    promptHTML: `Which verb completes <b>${esc(prompt)}</b>?`,
    options, correct: c.verb,
    explanation: `${c.phrase} — ${c.en}`,
    collocation: c
  };
}
function generateComparisonExercise(c){
  const idx = rnd() < 0.5 ? 0 : 1;
  const ex = c.examples[idx];
  const correct = idx === 0 ? c.a : c.b;
  const other = idx === 0 ? c.b : c.a;
  return {
    prompt: ex, promptHTML: ex.replace('___', '<b>___</b>'),
    options: shuffle([correct, other]), correct,
    explanation: idx === 0 ? c.aEx : c.bEx,
    note: c.note, comparison: c
  };
}
function generateSentenceBuilderExercise(level){
  const lvl = level && level !== 'all' ? level : rPick(['A1','A2','B1']);
  const subj = rPick([['Ich','I'], ['Du','You'], ['Er','He'], ['Sie','She'], ['Wir','We'], ['Ihr','You (pl)']]);
  const nouns = VOCAB.filter(w => ['der','die','das'].includes(w.art) && w.level === lvl);
  const poolN = nouns.length ? nouns : VOCAB.filter(w => ['der','die','das'].includes(w.art));
  const obj = rPick(poolN);
  // Accusative article adjustment for common verbs that take Akk
  const artMap = {der:'den', die:'die', das:'das'};
  const akkArt = artMap[obj.art] || obj.art;
  const verbTable = {
    A1: [
      ['gehe','go', false], ['komme','come', false], ['lerne','learn', true], ['spiele','play', true],
      ['esse','eat', true], ['trinke','drink', true], ['sehe','see', true], ['höre','hear', true]
    ],
    A2: [
      ['habe','have', true], ['kaufe','buy', true], ['brauche','need', true], ['suche','look for', true],
      ['finde','find', true], ['nehme','take', true], ['lese','read', true], ['schreibe','write', true]
    ],
    B1: [
      ['besuche','visit', true], ['verstehe','understand', true], ['kenne','know', true],
      ['erkläre','explain', true], ['vergleiche','compare', true], ['beschreibe','describe', true]
    ]
  };
  const verbs = verbTable[lvl] || verbTable.A1;
  const pair = rPick(verbs);
  const conjForm = pair[0], infEn = pair[1], takesAkk = pair[2];
  // Simple person agreement for a few irregulars is already in the forms (ich-forms mostly; adjust for du/er)
  let conj = conjForm;
  if(subj[0] === 'Du'){
    if(conjForm.endsWith('e') && !conjForm.endsWith('ie')) conj = conjForm.slice(0,-1) + 'st';
    else if(conjForm === 'habe') conj = 'hast';
    else if(conjForm === 'gehe') conj = 'gehst';
    else if(conjForm === 'komme') conj = 'kommst';
    else if(conjForm === 'sehe') conj = 'siehst';
    else if(conjForm === 'nehme') conj = 'nimmst';
    else if(conjForm === 'lese') conj = 'liest';
  } else if(subj[0] === 'Er' || subj[0] === 'Sie'){
    if(conjForm.endsWith('e') && !conjForm.endsWith('ie')) conj = conjForm.slice(0,-1) + 't';
    else if(conjForm === 'habe') conj = 'hat';
    else if(conjForm === 'gehe') conj = 'geht';
    else if(conjForm === 'komme') conj = 'kommt';
    else if(conjForm === 'sehe') conj = 'sieht';
    else if(conjForm === 'nehme') conj = 'nimmt';
    else if(conjForm === 'lese') conj = 'liest';
  } else if(subj[0] === 'Wir'){
    conj = conjForm.endsWith('e') ? conjForm.slice(0,-1) + 'en' : conjForm + 'en';
    if(conjForm === 'habe') conj = 'haben';
    if(conjForm === 'sehe') conj = 'sehen';
    if(conjForm === 'nehme') conj = 'nehmen';
    if(conjForm === 'lese') conj = 'lesen';
  } else if(subj[0] === 'Ihr'){
    if(conjForm.endsWith('e')) conj = conjForm.slice(0,-1) + 't';
    if(conjForm === 'habe') conj = 'habt';
    if(conjForm === 'sehe') conj = 'seht';
    if(conjForm === 'nehme') conj = 'nehmt';
    if(conjForm === 'lese') conj = 'lest';
  }
  const art = takesAkk ? akkArt : obj.art;
  const answer = `${subj[0]} ${conj} ${art} ${obj.de}.`;
  const en = `${subj[1]} ${infEn} the ${obj.en}.`;
  const tokens = shuffle([subj[0], conj, art, obj.de + '.']);
  return {level: lvl, answer, en, tokens};
}

function generateDictationExercise(level){
  const pool = [];
  PATTERNS.forEach(p => pool.push({de: p[3], en: p[4], level: 'A1'}));
  GRAMMAR_DATA.forEach(s => s.items.forEach(it => it.examples.forEach(e => pool.push({de: e[0], en: e[1], level: s.level}))));
  const filtered = level && level !== 'all' ? pool.filter(p => p.level === level) : pool;
  const item = rPick(filtered.length ? filtered : pool);
  return {level: item.level, de: item.de, en: item.en || ''};
}

/* ---------- Universal registry + dispatcher ---------- */
function diffN(d){ return d === 'easy' ? 1 : d === 'hard' ? 3 : d === 'expert' ? 4 : 2; }

const EXERCISE_REGISTRY = {
  vocab:       (c) => generateVocabExercise(c.type || 'de-en', null, diffN(c.difficulty), c.level),
  article:     (c) => generateVocabExercise('article', null, diffN(c.difficulty), c.level),
  de_en:       (c) => generateVocabExercise('de-en', null, diffN(c.difficulty), c.level),
  en_de:       (c) => generateVocabExercise('en-de', null, diffN(c.difficulty), c.level),
  listenVocab: (c) => generateVocabExercise('listen', null, diffN(c.difficulty), c.level),
  opposite:    (c) => generateVocabExercise('opposite', null, diffN(c.difficulty), c.level),
  synonym:     (c) => generateVocabExercise('synonym', null, diffN(c.difficulty), c.level),
  grammar:     (c) => generateGrammarExerciseLadder(c.level, c.difficulty),
  listening:   (c) => {
    const d = generateDialogueTask(c.level || 'A2');
    const q = rPick(d.questions);
    return {
      skill:'listening', topic:'dialogue', level:d.level,
      promptHTML:`🔊 <button class="btn small" onclick="playDialogue('${esc(d.lines.map(l=>l.de).join('|||')).replace(/'/g,"\'")}')">Play dialogue</button><br><br>${esc(q.q)}`,
      prompt: q.q, options: q.options, correct: q.correct,
      explanation: `Answer: ${q.correct}`, sourceId: 'd-' + d.title, dialogue: d
    };
  },
  connector:   (c) => generateConnectorExercise(rPick(CONNECTORS)),
  collocation: (c) => generateCollocationExercise(rPick(COLLOCATIONS)),
  compare:     (c) => generateComparisonExercise(rPick(VERB_COMPARISONS)),
  verbusage:   (c) => generateVerbUsageExercise(),
  sentence:    (c) => {
    const ex = generateSentenceBuilderExercise(c.level || 'A2');
    const wrongs = [];
    for(let i = 0; i < 3; i++){
      const sh = shuffle([...ex.tokens]).join(' ');
      if(sh !== ex.answer && !wrongs.includes(sh)) wrongs.push(sh);
    }
    while(wrongs.length < 2){
      const alt = generateSentenceBuilderExercise(c.level || 'A2');
      if(alt.answer !== ex.answer && !wrongs.includes(alt.answer)) wrongs.push(alt.answer);
    }
    return {skill:'word-order', topic:'Sentence order', level:ex.level,
      promptHTML:`Which is correct?<br><em class="mini-muted">${esc(ex.en)}</em>`,
      prompt:`Which is correct? "${ex.en}"`,
      options: shuffle([ex.answer, ...wrongs.slice(0,3)]),
      correct: ex.answer, explanation: ex.answer + ' — ' + ex.en};
  },
  mixed:       (c) => {
    const keys = ['vocab','article','de_en','en_de','opposite','synonym','grammar','listening','connector','collocation','compare','verbusage','sentence'];
    return EXERCISE_REGISTRY[rPick(keys)](c);
  }
};

function generateExercise(config){
  config = config || {skill:'vocab', level:'A2', difficulty:'mixed'};
  const gen = EXERCISE_REGISTRY[config.skill] || EXERCISE_REGISTRY.vocab;
  let ex, attempts = 0;
  do {
    try { ex = gen(config); } catch(e){ ex = generateVocabExercise('de-en'); }
    attempts++;
    if(ex && ex.prompt && ex.correct){
      const fp = exerciseFingerprint(ex.prompt + '|' + ex.correct);
      if(!isDuplicate(fp)){ rememberFingerprint(fp); break; }
    }
  } while(attempts < 5);
  return ex || generateVocabExercise('de-en');
}

function generateExerciseBatch({count, skill, level, difficulty, mode}){
  const out = [];
  for(let i = 0; i < count; i++){
    const s = mode === 'mixed' ? 'mixed' : (skill || 'vocab');
    out.push(generateExercise({skill:s, level:level || 'A2', difficulty: difficulty || 'mixed'}));
  }
  return out;
}

function selectAdaptiveSkill(){
  const weak = {};
  Object.values(S.mistakes).forEach(m => {
    const k = (m.type || m.topic || 'misc').split('_')[0];
    weak[k] = (weak[k] || 0) + m.count;
  });
  const entries = Object.entries(weak).sort((a,b) => b[1] - a[1]);
  const roll = rnd();
  if(roll < 0.45 && entries.length) return entries[0][0];
  if(roll < 0.75) return rPick(['vocab','grammar','listening','connector','collocation','compare','verbusage']);
  return 'vocab';
}
function generateAdaptiveExercise(level){
  return generateExercise({skill: selectAdaptiveSkill(), level: level || 'A2', difficulty: 'mixed'});
}

function playDialogue(joined){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const v = getGermanVoice();
  joined.split('|||').forEach(line => {
    const u = new SpeechSynthesisUtterance(line);
    u.lang = 'de-DE'; u.rate = S.settings.speechRate || 0.9;
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  });
  trackAudioPlay();
}

    el.querySelectorAll('[data-len]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
  });
  $('#startSession').onclick = () => {
    sessionState = {active:true, results:[], startTime:Date.now(), queue:[], idx:0, total:0};
    // Build a mix: 5 due, 3 mistakes, 5 new, 3 grammar, 1 listening, 1 speaking
    const dueWords = dueWordKeys().map(k => VOCAB.find(w => 'v'+w.n === k)).filter(Boolean);
    const mistakes = Object.values(S.mistakes).sort((a,b) => b.count - a.count);
    const queue = [];
    const warm = dueWords.length ? dueWords.slice(0, 5) : shuffle(VOCAB).slice(0, 5);
    warm.forEach(w => queue.push({kind:'vocab', w}));
    mistakes.slice(0, 3).forEach(m => queue.push({kind:'mistake', m}));
    shuffle(VOCAB.filter(w => !S.mastery['v'+w.n] || S.mastery['v'+w.n].status === 'NEW')).slice(0, 5).forEach(w => queue.push({kind:'vocab', w}));
    for(let i = 0; i < 3; i++) queue.push({kind:'generated', ex: generateExercise({skill:'mixed', level:'A2', difficulty:'mixed'})});
    queue.push({kind:'generated', ex: generateExercise({skill:'listening', level:'A2', difficulty:'normal'})});
    queue.push({kind:'generated', ex: generateExercise({skill:'sentence', level:'A2', difficulty:'normal'})});
    sessionState.queue = shuffle(queue);
    sessionState.total = queue.length;
    renderSessionCard(el);
  };
}

function renderSessionCard(el){
  if(sessionState.idx >= sessionState.total){ renderSessionSummary(el); return; }
  const item = sessionState.queue[sessionState.idx];
  el.innerHTML = `<div class="session-progress">${Array.from({length: sessionState.total}, (_, i) =>
    `<div class="sp-dot ${i < sessionState.idx ? 'done' : i === sessionState.idx ? 'current' : ''}"></div>`).join('')}</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px">Step ${sessionState.idx+1} of ${sessionState.total} · ${item.kind}</div>
    <div id="sessionBody"></div>`;
  const body = $('#sessionBody');
  if(item.kind === 'vocab'){
    const w = item.w;
    const ex = generateVocabExercise('de-en', [w, ...shuffle(VOCAB).slice(0,20)]);
    renderSessionExercise(body, ex, w);
  } else if(item.kind === 'mistake'){
    const m = item.m;
    body.innerHTML = `<div class="session-card"><div class="sc-type">Mistake review</div>
      <div style="font-size:15px;margin:8px 0">${esc(m.prompt)}</div>
      <div class="mini-muted">Your last: <span style="color:var(--warn)">${esc(m.userAnswer)}</span></div>
      <div class="mini-muted">Correct: <span style="color:var(--ok)">${esc(m.correctAnswer)}</span></div>
      <div class="mini-muted" style="margin-top:6px">${esc(m.explanation||'')}</div>
      <div class="row" style="margin-top:10px"><button class="btn good" id="sOk">✓ Got it</button></div></div>`;
    $('#sOk').onclick = () => {
      sessionState.results.push({correct:true}); sessionState.idx++;
      addStudyTime(20); renderSessionCard(el);
    };
  } else if(item.kind === 'generated'){
    renderSessionExercise(body, item.ex, null);
  }
}

function renderSessionExercise(body, ex, w){
  body.innerHTML = `<div class="session-card">
    <div class="sc-type">${ex.skill || 'practice'}</div>
    <div style="font-size:16px;margin:8px 0;line-height:1.5">${ex.promptHTML}</div>
    <div id="sOpts">${ex.options.map(o => `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    <div class="fb" style="margin-top:10px;font-size:13px"></div>
  </div>`;
  wireSpeakers(body);
  if(ex.autoPlay) speakGerman(ex.autoPlay);
  const fb = body.querySelector('.fb');
  body.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if(body.dataset.done) return;
    body.dataset.done = '1';
    const ok = b.dataset.v === ex.correct;
    body.querySelectorAll('.opt').forEach(x => { x.disabled = true; if(x.dataset.v === ex.correct) x.classList.add('correct'); else if(x === b) x.classList.add('wrong'); });
    fb.textContent = (ok ? '✅ ' : '❌ Correct: ' + ex.correct + '. ') + (ex.explanation || '');
    fb.style.color = ok ? 'var(--ok)' : 'var(--warn)';
    if(w) updateMastery(vocabKey(w), ok ? 2 : 0);

    setTimeout(() => { sessionState.idx++; renderSessionCard($('#view')); }, 900);

      if(vocabState.q){
        const s = vocabState.q;
        const syn = SYNONYMS.find(x => x.word === w.de);
        const synText = syn ? syn.syn.map(x => x[0]).join(' ') : '';
        const opp = OPPOSITES.filter(p => p[0] === w.de || p[2] === w.de).map(p => p.join(' ')).join(' ');
        const hay = [w.de, w.en, guOf(w.de) || '', synText, opp].join(' ').toLowerCase();

    });

  };

let flashState = {queue:[], idx:0, flipped:false};
function buildFlashQueue(){
  const due = dueWordKeys().map(k => VOCAB.find(w => 'v'+w.n === k)).filter(Boolean);
  flashState.queue = due.length ? shuffle(due) : shuffle(VOCAB).slice(0, 30);
  flashState.idx = 0; flashState.flipped = false;
}
function viewFlash(el){
  if(!flashState.queue.length) buildFlashQueue();
  el.innerHTML = `<h2>🧠 Flashcards</h2><p class="sub">SRS flashcards. Rate how well you knew it.</p>
    <div class="flash-wrap" id="flashWrap"></div>
    <div id="flashSrs" class="srs-buttons hidden">
      <button class="srs-btn again" data-q="0"><span class="srs-emoji">😵</span>Again</button>
      <button class="srs-btn hard" data-q="1"><span class="srs-emoji">😕</span>Hard</button>
      <button class="srs-btn good" data-q="2"><span class="srs-emoji">🙂</span>Good</button>
      <button class="srs-btn easy" data-q="3"><span class="srs-emoji">😎</span>Easy</button>
    </div>
    <div class="row mt" style="justify-content:center" id="flashRevealRow">
      <button class="btn ghost" id="fprev">← Prev</button>
      <button class="btn" id="freveal">Reveal</button>
      <button class="btn ghost" id="fnext">Next →</button>
    </div>
    <div class="center mt" style="color:var(--muted);font-size:13px" id="fcount"></div>`;
  $('#fprev').onclick = () => { if(flashState.idx > 0){ flashState.idx--; flashState.flipped = false; renderFlash(); } };
  $('#fnext').onclick = () => nextFlash();
  $('#freveal').onclick = () => { flashState.flipped = true; renderFlash(); };
  el.querySelectorAll('.srs-btn').forEach(b => b.onclick = () => {
    const w = flashState.queue[flashState.idx]; if(!w) return;
    updateMastery(vocabKey(w), +b.dataset.q);
    nextFlash();
  });
  renderFlash();
}
function renderFlash(){
  const wrap = $('#flashWrap'), total = flashState.queue.length;
  if(!total){ wrap.innerHTML = `<div class="empty">No cards.</div>`; return; }
  if(flashState.idx >= total) flashState.idx = 0;
  const w = flashState.queue[flashState.idx];
  const speakText = (w.art && w.art !== '-' ? w.art + ' ' : '') + w.de;
  const m = getMastery('v'+w.n);
  wrap.innerHTML = `<div class="flash ${flashState.flipped?'flipped':''}" id="flashCard">
    <div class="face front"><div class="big">${artHTML(w.art)}${esc(w.de)}</div><div class="small">Tap to reveal</div><div class="small" style="margin-top:12px">${esc(w.topic)} · ${w.level} · <span class="mastery-chip mastery-${m.status}">${m.status}</span></div></div>
    <div class="face back"><div class="big-en">${esc(meaningFull(w))}</div><div class="small">${artHTML(w.art)}${esc(w.de)}</div></div></div>
    <div class="center mt">${speakerBtn(speakText)}</div>`;
  $('#flashCard').onclick = e => { if(e.target.classList.contains('speak-btn'))return; flashState.flipped = !flashState.flipped; renderFlash(); };
  $('#fcount').textContent = `${flashState.idx+1} / ${total}`;
  wireSpeakers(wrap);
  if(flashState.flipped){ $('#flashSrs').classList.remove('hidden'); $('#flashRevealRow').classList.add('hidden'); }
  else { $('#flashSrs').classList.add('hidden'); $('#flashRevealRow').classList.remove('hidden'); }
  if(!flashState.flipped && S.settings.autoPlay) speakGerman(speakText);
}
function nextFlash(){ flashState.idx = (flashState.idx + 1) % flashState.queue.length; flashState.flipped = false; renderFlash(); }

let quizState = {mode:'article', queue:[], idx:0, score:0, answered:false, count:20, difficulty:'normal'};

const QUIZ_MODES = {
  article:     {label:'📖 Article', gen:(d) => generateVocabExercise('article', null, d)},
  de_en:       {label:'DE → EN', gen:(d) => generateVocabExercise('de-en', null, d)},
  en_de:       {label:'EN → DE', gen:(d) => generateVocabExercise('en-de', null, d)},
  opposite:    {label:'↔️ Opposites', gen:(d) => generateVocabExercise('opposite', null, d)},
  synonym:     {label:'📚 Synonyms', gen:(d) => generateVocabExercise('synonym', null, d)},
  listen:      {label:'🎧 Listening', gen:(d) => EXERCISE_REGISTRY.listening({level:'A2', difficulty:'normal'})},
  grammar:     {label:'📖 Grammar', gen:(d) => generateGrammarExerciseLadder('A2', 'normal')},
  connector:   {label:'🔗 Connectors', gen:(d) => generateConnectorExercise(rPick(CONNECTORS))},
  collocation: {label:'🧱 Collocations', gen:(d) => generateCollocationExercise(rPick(COLLOCATIONS))},
  compare:     {label:'⚖️ Compare', gen:(d) => generateComparisonExercise(rPick(VERB_COMPARISONS))},
  verbusage:   {label:'🔥 Verb usage', gen:(d) => generateVerbUsageExercise()},
  sentence:    {label:'🧩 Sentence', gen:(d) => EXERCISE_REGISTRY.sentence({level:'A2', difficulty:'normal'})},
  mixed:       {label:'🎲 Mixed', gen:(d) => EXERCISE_REGISTRY.mixed({level:'A2', difficulty:'normal'})}
};

function buildQuizQueue(mode, count, difficulty){
  const gen = (QUIZ_MODES[mode] || QUIZ_MODES.article).gen;
  const d = diffN(difficulty);
  quizState.queue = [];
  for(let i = 0; i < count; i++) quizState.queue.push(gen(d));
  quizState.idx = 0; quizState.score = 0; quizState.answered = false;
}

function viewQuiz(el){
  const modes = Object.keys(QUIZ_MODES);
  el.innerHTML = `<h2>${t('quiz_title')}</h2><p class="sub">${t('quiz_sub')}</p>
    <div class="card"><div class="row" style="gap:6px">
      ${modes.map(k => `<button class="btn small ${quizState.mode===k?'':'ghost'}" data-mode="${k}">${QUIZ_MODES[k].label}</button>`).join('')}
    </div></div>
    ${setupPanelHTML('quiz', quizState.count, quizState.difficulty)}
    <button class="btn" id="quizStart" style="width:100%">▶ Start (infinite)</button>
    <div id="quizBox" style="margin-top:14px"></div>`;
  el.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { quizState.mode = b.dataset.mode; viewQuiz(el); });
  wireSetupPanel(el, (group, val) => {
    if(group === 'count') quizState.count = +val;
    if(group === 'difficulty') quizState.difficulty = val;
  });
  $('#quizStart').onclick = () => {
    const setup = readSetupPanel(el, 'quiz');
    quizState.count = setup.count;
    quizState.difficulty = setup.difficulty;
    buildQuizQueue(quizState.mode, setup.count, setup.difficulty);
    renderQuiz();
  };
}

function renderQuiz(){
  const box = $('#quizBox');
  if(!quizState.queue.length){ box.innerHTML = ''; return; }
  if(quizState.idx >= quizState.queue.length){
    // Refill — infinite
    const more = quizState.count || 20;
    const gen = (QUIZ_MODES[quizState.mode] || QUIZ_MODES.article).gen;
    const d = diffN(quizState.difficulty);
    for(let i = 0; i < more; i++) quizState.queue.push(gen(d));
  }
  const q = quizState.queue[quizState.idx];
  box.innerHTML = `<div class="card"><div class="qstat">
      <span>${t('question_of', quizState.idx + 1, quizState.queue.length)}</span>
      <span>${t('score_label', quizState.score)}</span>
    </div>
    <div style="font-size:16px;margin:8px 0 14px;line-height:1.5">${q.promptHTML}</div>
    <div id="opts">${q.options.map(o => `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
    <div id="feedback" class="mt" style="font-size:13.5px;color:var(--muted)"></div>
    <button class="btn small ghost mt" id="quizStop">⏹ Stop</button>
  </div>`;
  box.querySelectorAll('.opt').forEach(b => b.onclick = () => answerQuiz(b, q));
  $('#quizStop').onclick = () => {
    quizState.queue = [];
    box.innerHTML = `<div class="card center"><h3>Stopped</h3><div class="mini-muted">You answered <b>${quizState.idx}</b> questions, ${quizState.score} correct.</div><button class="btn" id="again" style="margin-top:10px">New session</button></div>`;
    $('#again').onclick = () => viewQuiz($('#view'));
  };
  wireSpeakers(box);
}

function answerQuiz(btn, q){
  if(quizState.answered) return;
  quizState.answered = true;
  const ok = btn.dataset.v === q.correct;
  if(ok) quizState.score++;
  $$('#opts .opt').forEach(b => { b.disabled = true; if(b.dataset.v === q.correct) b.classList.add('correct'); else if(b === btn) b.classList.add('wrong'); });
  $('#feedback').innerHTML = ok ? '✅ Correct!' : `❌ Correct: <b>${esc(q.correct)}</b>. ${esc(q.explanation || '')}`;
  if(q.vocab) updateMastery(vocabKey(q.vocab), ok ? 2 : 0);
  if(!ok) recordMistake({type:q.skill || 'quiz', topic:q.topic || q.skill, prompt:q.prompt, userAnswer:btn.dataset.v, correctAnswer:q.correct, explanation:q.explanation, sourceId:q.sourceId});
  setTimeout(() => { quizState.idx++; quizState.answered = false; renderQuiz(); }, 1100);
}

function viewGrammar(el){

    el.innerHTML = `<h2>${t('grammar_title')}</h2><p class="sub">Rules, examples, mistakes, exercises.</p>
      <div class="card"><div class="row">
        <button class="btn ${activeLevel==='all'?'':'ghost'}" data-lvl="all">All</button>

        <button class="btn ${activeLevel==='A2'?'':'ghost'}" data-lvl="A2">A2</button>
        <button class="btn ${activeLevel==='B1'?'':'ghost'}" data-lvl="B1">B1</button>
        <button class="btn small good" id="grammarPractice">⚡ Practice ∞</button>
      </div></div>
      ${sections.map(sec => `<h3>${esc(sec.level)} · ${esc(sec.title)}</h3>${sec.items.map((it,idx) => grammarCardHTML(sec.level, idx, it)).join('')}`).join('')}`;
    el.querySelectorAll('[data-lvl]').forEach(b => b.onclick = () => { activeLevel = b.dataset.lvl; render(); });
    el.querySelectorAll('.g-exercise').forEach(ex => {
      const correct = +ex.dataset.correct;
      ex.querySelectorAll('.opt').forEach(b => b.onclick = () => {
        if(ex.dataset.done) return; ex.dataset.done = '1';
        const ok = +b.dataset.i === correct;
        ex.querySelectorAll('.opt').forEach(x => { x.disabled = true; if(+x.dataset.i === correct) x.classList.add('correct'); else if(x === b) x.classList.add('wrong'); });
        const fb = ex.querySelector('.fb');
        fb.textContent = (ok ? '✅ ' : '❌ Correct: ') + ex.dataset.why;
        fb.style.background = ok ? 'rgba(22,163,74,.12)' : 'rgba(225,29,72,.10)';
        S.grammarDone[ex.dataset.key] = 1; STORE.save();
        if(!ok) recordMistake({type:'grammar', topic:ex.dataset.key, prompt:ex.querySelector('.q').textContent, userAnswer:ex.querySelectorAll('.opt')[+b.dataset.i].textContent, correctAnswer:ex.querySelectorAll('.opt')[correct].textContent, explanation:ex.dataset.why, sourceId:ex.dataset.key});
      });
    });

    if(gp) gp.onclick = () => {

      location.hash = '#/quiz';
      setTimeout(() => renderQuiz(), 60);
    };
  };
  render();
}

let sbState = {item: null, used: [], answer: []};
function viewSentence(el){
  if(!sbState.item) sbState.item = generateSentenceBuilderExercise();
  const item = sbState.item;
  el.innerHTML = `<h2>${t('sentence_title')}</h2><p class="sub">New sentences generated each round.</p>
    <div class="card">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
        <span class="tag ${item.level}">${item.level}</span>
        <button class="btn small" id="sbNew">🔄 New</button>
      </div>
      <div style="font-size:14px;color:var(--muted);margin-bottom:6px">${esc(item.en)}</div>
      <div class="builder-answer" id="sbAnswer"></div>
      <div class="builder-tiles" id="sbTiles"></div>
      <div class="row">
        <button class="btn" id="sbCheck">✓ Check</button>
        <button class="btn ghost" id="sbReset">↻ Reset</button>
      </div>
      <div id="sbFb" class="mt"></div>
    </div>`;
  const renderAnswer = () => {
    const ans = $('#sbAnswer');
    if(!sbState.answer.length){ ans.innerHTML = '<span class="mini-muted">Tap tiles to build the sentence…</span>'; return; }
    ans.innerHTML = sbState.answer.map((a, i) => `<span class="word" data-a="${i}">${esc(a.word)}</span>`).join('');
    ans.querySelectorAll('[data-a]').forEach(w => w.onclick = () => {
      const idx = +w.dataset.a;
      const removed = sbState.answer.splice(idx, 1)[0];
      sbState.used[removed.origIndex] = false;
      renderTiles(); renderAnswer();
    });
  };
  const renderTiles = () => {
    const tiles = $('#sbTiles');
    tiles.innerHTML = item.tokens.map((tk, i) => `<button class="builder-tile ${sbState.used[i]?'used':''}" data-i="${i}">${esc(tk)}</button>`).join('');
    tiles.querySelectorAll('.builder-tile').forEach(b => b.onclick = () => {
      const i = +b.dataset.i; if(sbState.used[i]) return;
      sbState.used[i] = true;
      sbState.answer.push({word: item.tokens[i], origIndex: i});
      renderTiles(); renderAnswer();
    });
  };
  if(sbState.used.length !== item.tokens.length){ sbState.used = item.tokens.map(() => false); sbState.answer = []; }
  renderAnswer(); renderTiles();
  $('#sbReset').onclick = () => { sbState.used = item.tokens.map(() => false); sbState.answer = []; renderTiles(); renderAnswer(); $('#sbFb').innerHTML = ''; };
  $('#sbNew').onclick = () => { sbState.item = null; sbState.used = []; sbState.answer = []; viewSentence(el); };
  $('#sbCheck').onclick = () => {
    const user = sbState.answer.map(a => a.word).join(' ').replace(/\s+/g, ' ').trim();
    const correct = item.answer.replace(/\s+/g, ' ').trim();
    const fb = $('#sbFb');
    const ok = user === correct;
    fb.innerHTML = ok ? `<div style="padding:10px;background:rgba(22,163,74,.12);border-radius:8px;color:var(--ok);font-weight:650">✅ Correct!</div>` :
      `<div style="padding:10px;background:rgba(225,29,72,.10);border-radius:8px"><b>❌ Correct:</b> ${esc(correct)} ${speakerBtn(correct)}</div>`;
    if(ok){ S.sentencesBuilt = (S.sentencesBuilt||0) + 1; STORE.save(); checkAchievements(); }
    wireSpeakers(fb);
    setTimeout(() => { if(ok){ sbState.item = null; sbState.used = []; sbState.answer = []; viewSentence(el); } }, 1800);
  };
}

let spellState = {idx:0, pool:[], submitted:false};
function viewSpelling(el){
  if(!spellState.pool.length){
    const weak = VOCAB.filter(w => { const m = S.mastery['v'+w.n]; return m && (m.status === 'LEARNING' || m.status === 'FAMILIAR' || m.status === 'NEW'); });
    spellState.pool = shuffle(weak.length ? weak : VOCAB).slice(0, 30);
  }
  const w = spellState.pool[spellState.idx % spellState.pool.length];
  const speakText = (w.art && w.art !== '-' ? w.art + ' ' : '') + w.de;
  el.innerHTML = `<h2>${t('spelling_title')}</h2><p class="sub">Listen and type the German word.</p>
    <div class="card" style="text-align:center">
      <div style="margin:10px 0"><button class="btn" id="spPlay">🔊 Play</button></div>
      <div class="mini-muted" style="margin-top:6px">${esc(meaningFull(w))}</div>
      <input type="text" class="spell-input" id="spInput" placeholder="Type here…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <div class="row" style="justify-content:center;margin-top:12px">
        <button class="btn" id="spCheck">Check</button>
        <button class="btn ghost" id="spReveal">Reveal</button>
        <button class="btn ghost" id="spNext">Next →</button>
      </div>
      <div id="spFb" class="mt" style="font-size:14px;min-height:24px"></div>
    </div>`;
  const input = $('#spInput');
  setTimeout(() => input.focus(), 100);
  speakGerman(speakText);
  const checkAnswer = () => {
    if(spellState.submitted) return;
    spellState.submitted = true;
    const user = input.value.trim();
    const target = w.de.toLowerCase();
    const ok = user.toLowerCase().replace(/\s+/g, ' ') === target;
    input.classList.add(ok ? 'correct' : 'wrong');
    const fb = $('#spFb');
    if(ok){
      fb.innerHTML = '<span style="color:var(--ok);font-weight:650">✅ Correct!</span>';
      S.spelledCorrect = (S.spelledCorrect||0) + 1;
      updateMastery(vocabKey(w), 2);
    } else {
      fb.innerHTML = `<span style="color:var(--warn)">❌ Correct: </span><b>${esc(speakText)}</b> ${speakerBtn(speakText)}`;
      wireSpeakers(fb);
      updateMastery(vocabKey(w), 0);
      recordMistake({type:'spelling', topic:w.topic, prompt:`Spell: "${w.en}"`, userAnswer:user, correctAnswer:w.de, explanation:`${speakText} = ${meaningFull(w)}`, sourceId:'v'+w.n});
    }
  };
  $('#spCheck').onclick = checkAnswer;
  input.onkeydown = e => { if(e.key === 'Enter'){ spellState.submitted ? nextSpell(el) : checkAnswer(); } };
  $('#spPlay').onclick = () => speakGerman(speakText);
  $('#spReveal').onclick = () => { input.value = w.de; input.classList.add('wrong'); $('#spFb').innerHTML = `<span style="color:var(--warn)">Correct: </span><b>${esc(speakText)}</b>`; spellState.submitted = true; };
  $('#spNext').onclick = () => nextSpell(el);
}
function nextSpell(el){ spellState.idx = (spellState.idx + 1) % spellState.pool.length; if(spellState.idx === 0) spellState.pool = shuffle(spellState.pool); spellState.submitted = false; viewSpelling(el); }

    } else {
      const uw = user.split(/\s+/), tw = target.split(/\s+/);
      const diff = tw.map((word, i) => uw[i] === word ? esc(word) : `<span style="background:rgba(225,29,72,.2);padding:1px 4px;border-radius:3px">${esc(word)}</span>`).join(' ');

    }
  };
  $('#dReveal').onclick = () => { $('#dInput').value = item.de; dictState.submitted = true; };
