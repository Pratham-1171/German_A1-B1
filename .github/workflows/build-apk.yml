name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      local_mode:
        description: "Practice-only build WITHOUT login/sync (do not give this to students)"
        type: boolean
        default: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Run the test-suite (grammar engine, app screens, login/sync, database security rules)
        run: npm test
      - name: Build the course (injects the backend address)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ALLOW_LOCAL_MODE: ${{ inputs.local_mode && '1' || '' }}
        run: python3 scripts/build-course.py
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Sprachtreppe-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
